name: Publish a cask
description: Attach an app archive to a release of the tap, then write the app's cask into Casks/ with its version and sha256, through a pull request merged as soon as the tap allows.

inputs:
  cask:
    description: The cask token, such as memo.
    required: true
  version:
    description: The version to publish; a leading v is dropped.
    required: true
  archive:
    description: The archive to publish, as a path or a glob matching one file.
    required: true
  definition:
    description: The cask definition in the calling repository; its version and sha256 lines are replaced.
    required: true
  token:
    description: A token that can write the contents and the pull requests of the tap.
    required: true
  signing-key:
    description: The SSH private key that signs the cask commit as Fun Driven Stuff <stuff@fundriven.dev>.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAP: ${{ github.action_repository }}
        SOURCE: ${{ github.repository }}
        CASK: ${{ inputs.cask }}
        VERSION: ${{ inputs.version }}
        ARCHIVE: ${{ inputs.archive }}
        DEFINITION: ${{ inputs.definition }}
        SIGNING_KEY: ${{ inputs.signing-key }}
      run: |
        set -euo pipefail
        version="${VERSION#v}"
        tag="$CASK-$version"
        # shellcheck disable=SC2206 # the glob must expand
        archives=($ARCHIVE)
        [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]] || { echo "$ARCHIVE must match exactly one file" >&2; exit 1; }
        archive="${archives[0]}"
        name=$(basename "$archive")
        sha256=$(sha256sum "$archive" | cut -d' ' -f1)

        # The archive first, so the cask never points at a missing file. The release is
        # drafted, filled, then published, as immutable releases allow no later upload.
        # A rerun reuses a published archive only if it is the very same file.
        if published=$(gh release view "$tag" --repo "$TAP" --json assets --jq ".assets[] | select(.name == \"$name\") | .digest" 2>/dev/null) && [[ -n "$published" ]]; then
          [[ "$published" == "sha256:$sha256" ]] || { echo "$tag already holds a different $name" >&2; exit 1; }
        else
          gh release view "$tag" --repo "$TAP" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$TAP" --draft --title "$CASK $version" --notes "$CASK $version, published from $SOURCE."
          gh release upload "$tag" "$archive" --repo "$TAP" --clobber
          gh release edit "$tag" --repo "$TAP" --draft=false
        fi

        tap=$(mktemp -d)
        git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$TAP.git" "$tap"
        mkdir -p "$tap/Casks"
        sed -e "s/^  version .*/  version \"$version\"/" -e "s/^  sha256 .*/  sha256 \"$sha256\"/" "$DEFINITION" > "$tap/Casks/$CASK.rb"
        cd "$tap"
        git add Casks
        if git diff --cached --quiet; then echo "Casks/$CASK.rb already at $version"; exit 0; fi
        key=$(mktemp)
        trap 'rm -f "$key"' EXIT
        printf '%s\n' "$SIGNING_KEY" > "$key"
        # The cask reaches main through a pull request: nothing pushes to main directly.
        # A rerun force-pushes the same branch and reuses its open pull request.
        branch="cask/$tag"
        git switch --quiet --create "$branch"
        git -c user.name="Fun Driven Stuff" -c user.email="stuff@fundriven.dev" \
          -c gpg.format=ssh -c user.signingkey="$key" \
          commit --quiet --gpg-sign -m "$CASK $version"
        git push --quiet --force origin "$branch"
        pr=$(gh pr list --repo "$TAP" --head "$branch" --state open --json number --jq '.[0].number // empty')
        if [[ -z "$pr" ]]; then
          url=$(gh pr create --repo "$TAP" --head "$branch" --title "$CASK $version" \
            --body "$CASK $version, published from $SOURCE.")
          pr=${url##*/}
        fi
        # GitHub works out whether a new pull request can merge a moment after it opens;
        # until then, gh would ask for auto-merge rather than merge it.
        for _ in {1..30}; do
          [[ "$(gh pr view "$pr" --repo "$TAP" --json mergeStateStatus --jq .mergeStateStatus)" != UNKNOWN ]] && break
          sleep 2
        done
        # Merges at once while the tap requires no check, else once its checks pass.
        gh pr merge "$pr" --repo "$TAP" --auto --squash --delete-branch
        echo "Published $CASK $version to $TAP through pull request #$pr"
